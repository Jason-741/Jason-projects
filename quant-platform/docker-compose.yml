# Local stack: TimescaleDB (PostgreSQL), Redis (reserved for caching), API, web.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment: { POSTGRES_USER: quant, POSTGRES_PASSWORD: quant, POSTGRES_DB: quant }
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://quant:quant@db:5432/quant
      CACHE_DIR: /app/.cache
    depends_on: [db]
    ports: ["127.0.0.1:8000:8000"]
  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://api:8000" }
    environment: { BACKEND_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
volumes:
  dbdata:
