name: ENR Market Brief

on:
  schedule:
    # GitHub cron is UTC. Each brief has two slots; the script only runs the one
    # that lands at 7:20am Toronto time (EDT in summer, EST in winter), so the
    # 8am email routine has it ready.
    - cron: "20 11 * * 1-6"  # Monday-Saturday daily brief
    - cron: "20 12 * * 1-6"
    - cron: "20 11 * * 0"    # Sunday weekly recap
    - cron: "20 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which brief to send"
        type: choice
        options: [daily, weekly]
        default: daily

permissions:
  contents: read
  issues: write

concurrency: market-brief

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-brief/requirements.txt
      - run: pip install -r market-brief/requirements.txt
      - run: python market-brief/brief.py
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIEF_MENTION: ${{ github.repository_owner }}
          # Optional: add these repo secrets to get a real email instead of a GitHub notification.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
