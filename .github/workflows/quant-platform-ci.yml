name: quant-platform CI
on:
  push:
    paths: ["quant-platform/**", ".github/workflows/quant-platform-ci.yml"]
  pull_request:
    paths: ["quant-platform/**"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quant-platform/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: quant-platform/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
